<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recetas de Helados</title>
    <link rel="icon" type="image/x-icon" href="favicon.png?" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.2/css/bootstrap.min.css"
    />
    <style>
      header {
        display: flex;
        align-items: center;
      }

      /* Keep card relative for positioning */
      .card {
        position: relative;
      }

      /* Anchor is the image container and clips the ribbon */
      .card a {
        position: relative;
        display: block;
        overflow: hidden; /* clip the ribbon so only the portion over the image is visible */
      }

      /* Ribbon base styles; exact position & sizing are calculated in JS */
      .ribbon {
        position: absolute;
        left: 0;
        top: 0;
        background: rgba(220, 53, 69, 0.98); /* red */
        color: white;
        padding: 10px 60px; /* fallback */
        transform-origin: center center;
        font-weight: 800;
        font-size: 1.05rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        z-index: 10;
        pointer-events: none;
        white-space: nowrap;
        box-sizing: border-box;
      }

      .ribbon[hidden] {
        display: none !important;
      }

      /* Ensure image fills available width and keeps its aspect ratio */
      .card-img-top {
        display: block;
        width: 100%;
        height: auto;
        object-fit: cover;
      }

      @media (min-width: 992px) {
        .ribbon { font-size: 1.25rem; }
      }
    </style>
  </head>
  <body>
    <header class="bg-primary py-3">
      <div class="container">
        <img
          src="fotos/logo.png"
          alt="..."
          width="50"
          style="margin-top: -2%"
        />
        <h1 class="text-white d-inline-block ms-3">Recetas de Helados</h1>
      </div>
    </header>
    <div id="render" class="container py-5" hidden="hidden">
      <div id="row" class="row mb-3">
        <div id="card" class="col-md-4">
          <div class="card">
            <a id="link" href="">
              <div class="ribbon" hidden aria-hidden="true">¡Receta en progreso!</div>
              <img id="foto" src="" class="card-img-top" alt="..." />
            </a>
            <div class="card-body">
              <h5 id="sabor" class="card-title"></h5>
              <p id="pie" class="card-text"></p>
            </div>
          </div>
          <p></p>
        </div>
      </div>
    </div>

    <footer class="bg-secondary py-3">
      <div class="container">
        <p class="text-white mb-0">&copy; 2023 Fede Krum (Neo-Heladero)</p>
      </div>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/js/bootstrap.min.js"></script>
    <script>
      var cardHTML = document.getElementById("card").outerHTML;
      document.getElementById("card").remove();
      // Remover src="" para evitar que el navegador inicie peticiones en blanco formen condiciones de carrera
      cardHTML = cardHTML.replace('src=""', '');
      
      var rawHTML = document.getElementById("row").outerHTML;
      document.getElementById("row").remove();

      // Reposition helper used on resize to recalc all visible ribbons
      function repositionAllRibbons() {
        document.querySelectorAll('.ribbon').forEach(function(r) {
          if (r.hasAttribute('hidden')) return;
          repositionRibbon(r);
        });
      }

      function repositionRibbon(ribbonElem) {
        if (!ribbonElem) return;
        var anchor = ribbonElem.parentElement; // the <a> that wraps the image
        if (!anchor) return;
        var w = anchor.clientWidth;
        var h = anchor.clientHeight;
        // desired center relative to the anchor's top-left:
        // left = 1.5 * width  (right + width/2)
        // top  = -0.5 * height (above by half height)
        var cx = w * 1.5;
        var cy = -h * 0.5;
        ribbonElem.style.left = cx + 'px';
        ribbonElem.style.top  = cy + 'px';
        ribbonElem.style.transform = 'translate(-50%,-50%) rotate(-45deg)';
        var padX = Math.max(8, Math.round(w * 0.55));
        var padY = Math.max(5, Math.round(Math.min(w,h) * 0.11));
        ribbonElem.style.padding = padY + 'px ' + padX + 'px';
        ribbonElem.style.maxWidth = Math.round(w * 1.6) + 'px';
      }

      // ----- Levanta los datos de los sabores disponibles
      function reqListenerSabores() {
        data = JSON.parse(this.responseText);
        data = Object.entries(data)
          .map(([key, value]) => {
            return { id: key, ...value };
          })
          .filter((item) => item.active === true);
        renderPage(data);
        //console.log(data);
      }
      const reqSabores = new XMLHttpRequest();
      reqSabores.addEventListener("load", reqListenerSabores);
      reqSabores.open("GET", "datos.json");
      reqSabores.send();

      // Renderiza la pagina
      function renderPage(data) {
        var row = -1;
        var card = 0;
        var cardID;
        var renderContainer = document.getElementById("render");

        for (let index = 0; index < data.length; index++) {
          if ((index + 1) % 3 == 1 % 3) {
            row++;
            card = 0;
            // Usamos insertAdjacentHTML para no destruir lo anterior
            renderContainer.insertAdjacentHTML('beforeend', rawHTML);
            // Buscamos el último row insertado para darle ID
            var lastRow = renderContainer.lastElementChild;
            lastRow.id = "row" + row;
          } else {
            card++;
          }

          var currentRow = document.getElementById("row" + row);
          currentRow.insertAdjacentHTML('beforeend', cardHTML);
          
          cardID = row * 3 + card + 1;
          
          // Buscamos los elementos dentro del contexto de la fila actual para evitar colisiones de ID
          var currentCard = currentRow.lastElementChild;
          currentCard.id = "card" + cardID;

          var linkElem = currentCard.querySelector("#link");
          linkElem.href = "producto.html?" + data[cardID - 1].id;
          linkElem.id = "link" + cardID;

          var fotoElem = currentCard.querySelector("#foto");
          fotoElem.id = "foto" + cardID;
          
          // Definimos el evento sobre el elemento directamente (no tiene el problema de var closure porque 'this' se enlaza al DOM node)
          fotoElem.onerror = function () {
            this.onerror = null; // Evita bucle infinito si any.jpg no existe
            this.src = "fotos/any.jpg";
          };
          // Luego le damos la dirección
          fotoElem.src = "fotos/" + data[cardID - 1].id + ".jpg";

          var saborElem = currentCard.querySelector("#sabor");
          saborElem.innerHTML = data[cardID - 1].titulo;
          saborElem.id = "sabor" + cardID;

          var pieElem = currentCard.querySelector("#pie");
          pieElem.innerHTML = data[cardID - 1].pie;
          pieElem.id = "pie" + cardID;

          // Mostrar el contenedor
          renderContainer.removeAttribute("hidden");

          // Mostrar la cinta "¡Receta en progreso!" si el JSON indica inProgres: true
          var ribbonElem = currentCard.querySelector(".ribbon");
          try {
            if (data[cardID - 1].inProgres) {
              // show and position when image dimensions are available
              var showRibbon = function() {
                ribbonElem.removeAttribute('hidden');
                repositionRibbon(ribbonElem);
              };

              if (fotoElem.complete && fotoElem.naturalWidth !== 0) {
                showRibbon();
              } else {
                fotoElem.addEventListener('load', showRibbon, { once: true });
                // if image fails and onerror sets any.jpg, load will fire for that too
              }
            } else {
              ribbonElem.setAttribute("hidden", "hidden");
            }
          } catch (e) {
            // Si por alguna razón no existe la propiedad, la cinta queda oculta
            if (ribbonElem) ribbonElem.setAttribute("hidden", "hidden");
          }
        }

        // After rendering all cards, ensure ribbons reposition on resize
        window.removeEventListener('resize', repositionAllRibbons);
        window.addEventListener('resize', repositionAllRibbons);
      }

      //
      window.addEventListener("load", function() { equalizeCardHeight(); repositionAllRibbons(); });
      window.addEventListener("resize", function() { equalizeCardHeight(); /* repositionAllRibbons called in renderPage */ });

      function equalizeCardHeight() {
        var container = document.getElementById("render");
        var rows = container.querySelectorAll(".row");

        rows.forEach(function (row) {
          var cards = Array.from(row.querySelectorAll(".card"));

          // Reset card heights
          cards.forEach(function (card) {
            card.style.height = "";
          });

          var maxHeight = 0;

          // Calculate and set the maximum height for cards in the row
          cards.forEach(function (card) {
            var cardHeight = card.offsetHeight;
            if (cardHeight > maxHeight) {
              maxHeight = cardHeight;
            }
          });

          // Set equal height for all cards in the row
          cards.forEach(function (card) {
            card.style.height = maxHeight + "px";
          });
        });
      }
    </script>
  </body>
</html>
